name: Build Forge Duel APK

# Builds the personal "Forge Duel" Android app (Adventure Duel mode).
# Run it from the Actions tab (Run workflow), or push to the adventure-duel branch.
# The APK is attached to the run as a downloadable artifact named "forge-duel-apk".

on:
  workflow_dispatch:
    inputs:
      profile:
        description: 'Maven profile: android-dev-build installs next to official Forge as "Forge Duel"; android-test-build replaces it'
        required: false
        default: 'android-dev-build'
  push:
    branches: [ adventure-duel ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PROFILE: ${{ github.event.inputs.profile || 'android-dev-build' }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Set up Android tools
        run: |
          ${ANDROID_SDK_ROOT}/cmdline-tools/latest/bin/sdkmanager --sdk_root=$ANDROID_SDK_ROOT --install "build-tools;35.0.0" "platform-tools" "platforms;android-35"

      - name: Install Android maven plugin
        run: |
          mkdir -p ~/.m2/repository/com/simpligility/maven/plugins/android-maven-plugin/4.6.2
          cd ~/.m2/repository/com/simpligility/maven/plugins/android-maven-plugin/4.6.2
          curl -L -o android-maven-plugin-4.6.2.jar https://github.com/Card-Forge/android-maven-plugin/releases/download/4.6.2/android-maven-plugin-4.6.2.jar
          curl -L -o android-maven-plugin-4.6.2.pom https://github.com/Card-Forge/android-maven-plugin/releases/download/4.6.2/android-maven-plugin-4.6.2.pom
          cd -
          mvn -B install -Dmaven.test.skip=true

      - name: Install virtual framebuffer (if not available)
        run: command -v Xvfb >/dev/null 2>&1 || { sudo apt update && sudo apt install -y xvfb; }

      - name: Build APK
        run: |
          export DISPLAY=":1"
          Xvfb :1 -screen 0 800x600x8 &
          mvn -U -B -P "$PROFILE" verify -e -T 1C -Dandroid.sdk.path=$ANDROID_SDK_ROOT -Dandroid.buildToolsVersion=35.0.0 -Dmaven.test.skip=true
          ls -la forge-gui-android/target/*.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: forge-duel-apk
          path: forge-gui-android/target/*.apk
          if-no-files-found: error
